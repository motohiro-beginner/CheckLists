<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チェックリスト作成画面</title>
    <link rel="stylesheet" href="/css/addCheckListStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<div id="box">
    <div id="upper">
        <h1 id="title">チェックリスト新規作成画面</h1>
        <button id="backBtn">
            <span class="material-symbols-outlined">undo</span>
        </button>
    </div>
    <div class="newCheckListContainer">
        <div class="nameColumn">
            <div class="checkListLabel">チェックリスト名<span class="essentialLabel">(必須)</span></div>
            <input class="checkListName"></input>
        </div>
        <div class="createdAtLabel">年月日<span class="essentialLabel">(必須)</span><span class="supplementLabel createdAtLabel">※半角英数字のみ</span></div>
        <div class="createdAtColumn">
            <div class="yearLabel">年</div>
            <input class=year type="text"></input>
            <div class="monthLabel">月</div>
            <input class="month" type="text"></input>
            <div class="dayLabel">日</div>
            <input class="day"></input>
        </div>
        <div class="itemLabel">項目の作成<span class="itemLabel essentialLabel">(必須)</span></div>
        <div class="itemColumns">
        </div>
        <button class="saveBtn">
            <span class="material-symbols-outlined">save</span>
        </button>
    </div>
    <script src="js/addCheckList/addCheckListJs.js" type="module"></script>
    <script src="js/addCheckList/saveCheckListJs.js" type="module"></script>
</div>
</body>
</html>
